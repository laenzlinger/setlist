name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Build
      run: make build

    - uses: golangci/golangci-lint-action@v9

    - name: Unit Test
      run: make test

    - name: Integration Test
      run: make test-integration
